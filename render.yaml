# Render Blueprint — Pidaka (free tier)
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: pidaka-db
    plan: free
    databaseName: pidaka
    user: pidaka

services:
  - type: web
    name: pidaka
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:push
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pidaka-db
          property: connectionString
